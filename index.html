<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HIDDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>

<div class="wrap">
  <div class="topline">
    <div class="title-row">
      <h1 class="masthead"><img class="masthead-icon" src="icon.svg" alt="">HIDDEN</h1>
      <div class="header-btns">
        <button class="icon-btn" id="myCasesTrigger" aria-label="My cases">
          <span class="badge" id="myCasesBadge" style="display:none;"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        </button>
        <button class="icon-btn profile-trigger" id="profileTrigger" aria-label="Open profile"></button>
      </div>
    </div>
    <div class="deck">games where your opponent can't see your move</div>
  </div>

  <div class="layout">
    <div class="main-col">
      <nav class="tabs" id="tabs"><!-- injected by app.js --></nav>
      <div class="provenance">STARKNET MAINNET <span class="sep">&middot;</span> STRK20 PRIVACY POOL <span class="sep">&middot;</span> NO NAMES, NO HISTORY</div>
      <div class="stage" id="stage"><!-- injected by app.js --></div>
    </div>
    <aside class="side-col" id="sideProfile"><!-- injected by app.js --></aside>
  </div>
</div>

<div class="overlay-backdrop" id="profileOverlay"></div>
<div class="overlay-backdrop" id="myCasesOverlay"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
